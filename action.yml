name: "Fossier PR Check"
description: "Evaluate pull request contributors for spam probability"
branding:
  icon: "shield"
  color: "orange"

inputs:
  github-token:
    description: "GitHub token with PR write access"
    required: true
    default: ${{ github.token }}
  pr-token:
    description: >
      Token used to OPEN the trust-update PR for /fossier vouch|reject|vouch-all.
      Defaults to github-token. If your org/repo disables "Allow GitHub Actions
      to create and approve pull requests", the default GITHUB_TOKEN cannot open
      PRs — set this to a Personal Access Token or GitHub App token with
      `pull-requests: write`. If left unset and PR creation is blocked, fossier
      pushes the branch and comments a one-click "compare & create PR" link
      instead of failing.
    required: false
    default: ""
  config-path:
    description: "Path to fossier.toml (default: auto-detect)"
    required: false
  db-cache-key:
    description: "Custom cache key prefix for DB persistence"
    required: false
    default: "fossier-db"
  fail-on-deny:
    description: "Fail the check run when outcome is DENY (for use as required status check)"
    required: false
    default: "false"
  contact-url:
    description: "URL where contributors can reach maintainers to appeal (e.g. Discord, Matrix, email)"
    required: false
    default: ""
  registry-api-key:
    description: "API key for the Fossier global registry (report/check known spammers)"
    required: false
    default: ""
  registry-url:
    description: "Custom registry URL (default: https://registry.fossier.io)"
    required: false
    default: ""

outputs:
  outcome:
    description: "Decision outcome: allow, review, or deny"
    value: ${{ steps.evaluate.outputs.outcome }}
  tier:
    description: "Contributor trust tier"
    value: ${{ steps.evaluate.outputs.tier }}
  score:
    description: "Spam score (0-100, only for unknown contributors)"
    value: ${{ steps.evaluate.outputs.score }}
  details:
    description: "Full decision details as JSON"
    value: ${{ steps.evaluate.outputs.details }}

runs:
  using: "composite"
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install fossier
      shell: bash
      run: uv pip install --system ${{ github.action_path }}

    - name: Restore DB cache
      uses: actions/cache@v4
      with:
        path: .fossier.db
        key: ${{ inputs.db-cache-key }}-${{ github.repository }}
        restore-keys: |
          ${{ inputs.db-cache-key }}-${{ github.repository }}

    - name: Evaluate PR
      id: evaluate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        FOSSIER_FAIL_ON_DENY: ${{ inputs.fail-on-deny }}
        FOSSIER_CONTACT_URL: ${{ inputs.contact-url }}
        FOSSIER_REGISTRY_API_KEY: ${{ inputs.registry-api-key }}
        FOSSIER_REGISTRY_URL: ${{ inputs.registry-url }}
      run: |
        set +e
        python -m fossier.action
        exit_code=$?
        set -e
        if [ "$FOSSIER_FAIL_ON_DENY" = "true" ] && [ "$exit_code" = "1" ]; then
          echo "::error::Fossier denied this PR"
          exit 1
        fi
        exit 0

    - name: Open trust update PR
      if: env.FOSSIER_TRUST_CHANGED == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_PR_TOKEN: ${{ inputs.pr-token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # The PR that carried the /fossier command (issue_comment events only).
        # Used to post a fallback comment if we can't open the trust PR.
        SOURCE_PR: ${{ github.event.issue.number }}
      run: |
        git config user.name "fossier[bot]"
        git config user.email "fossier[bot]@users.noreply.github.com"

        # Branch off current HEAD (the default branch on issue_comment events,
        # which is where /fossier vouch/reject/vouch-all originate).
        git checkout -B "$FOSSIER_TRUST_BRANCH"

        echo "--- working tree state before staging ---"
        echo "FOSSIER_TRUST_FILE=$FOSSIER_TRUST_FILE"
        git status --short

        # Stage VOUCHED.td. Prefer the absolute path Python recorded in
        # FOSSIER_TRUST_FILE; fall back to scanning both supported locations
        # for older callers. Use -f so an unexpected .gitignore entry can't
        # silently drop the staging.
        staged=0
        if [ -n "$FOSSIER_TRUST_FILE" ] && [ -f "$FOSSIER_TRUST_FILE" ]; then
          git add -f -- "$FOSSIER_TRUST_FILE"
          staged=1
        else
          for candidate in VOUCHED.td .github/VOUCHED.td; do
            if [ -f "$candidate" ]; then
              git add -f -- "$candidate"
              staged=1
            fi
          done
        fi

        if [ "$staged" = "0" ]; then
          echo "::error::Fossier wrote no VOUCHED.td file we can locate."
          echo "FOSSIER_TRUST_FILE=$FOSSIER_TRUST_FILE"
          echo "--- git status ---"
          git status --short
          exit 1
        fi

        if git diff --cached --quiet; then
          echo "::warning::VOUCHED.td was located but contained no changes to commit."
          echo "FOSSIER_TRUST_FILE=$FOSSIER_TRUST_FILE"
          echo "--- git status ---"
          git status --short
          echo "--- working tree diff ---"
          git diff -- "${FOSSIER_TRUST_FILE:-VOUCHED.td}" || true
          exit 0
        fi
        git commit -m "$FOSSIER_TRUST_COMMIT_MSG"
        git push --force origin "$FOSSIER_TRUST_BRANCH"

        # Token used to open the PR. Defaults to github-token; orgs that
        # disable "Allow GitHub Actions to create and approve pull requests"
        # can pass a PAT/App token via the pr-token input to open PRs anyway.
        PR_TOKEN="${INPUT_PR_TOKEN:-$GITHUB_TOKEN}"

        # One-click "compare & create PR" URL — the escape hatch when the API
        # can't open the PR for us. Pre-fills the PR form (?expand=1).
        COMPARE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$FOSSIER_TRUST_BRANCH?expand=1"

        # Open a PR if one isn't already open for this branch.
        existing=$(GH_TOKEN="$PR_TOKEN" gh pr list \
          --head "$FOSSIER_TRUST_BRANCH" \
          --base "$DEFAULT_BRANCH" \
          --state open \
          --json number -q '.[0].number' || true)
        if [ -n "$existing" ]; then
          echo "PR #$existing already open for $FOSSIER_TRUST_BRANCH; branch updated"
          exit 0
        fi

        if GH_TOKEN="$PR_TOKEN" gh pr create \
          --base "$DEFAULT_BRANCH" \
          --head "$FOSSIER_TRUST_BRANCH" \
          --title "$FOSSIER_TRUST_PR_TITLE" \
          --body "$FOSSIER_TRUST_PR_BODY"; then
          echo "Opened trust-update PR for $FOSSIER_TRUST_BRANCH"
          exit 0
        fi

        # PR creation failed. The overwhelmingly common cause is the repo/org
        # setting "Allow GitHub Actions to create and approve pull requests"
        # being disabled — GITHUB_TOKEN then can't open PRs. The branch is
        # already pushed, so don't fail the run: surface a one-click compare
        # link and tell maintainers how to make it "just work" next time.
        echo "::warning::Could not open the trust-update PR automatically. Branch '$FOSSIER_TRUST_BRANCH' was pushed. Open it here: $COMPARE_URL"

        if [ -n "$SOURCE_PR" ]; then
          COMMENT_BODY=$(printf '%s\n' \
            "**Fossier:** the trust update was pushed to \`$FOSSIER_TRUST_BRANCH\`, but I couldn't open the pull request automatically." \
            "" \
            "👉 **[Compare & create the pull request]($COMPARE_URL)**" \
            "" \
            "This usually means GitHub Actions isn't permitted to create pull requests in this repo. To make \`/fossier vouch\` open the PR automatically, a maintainer can either:" \
            "" \
            "- Enable **Settings → Actions → General → Workflow permissions → _Allow GitHub Actions to create and approve pull requests_**, then re-run \`/fossier vouch\`; or" \
            "- Pass a \`pr-token\` action input (a PAT or GitHub App token with \`pull-requests: write\`).")
          GH_TOKEN="$PR_TOKEN" gh pr comment "$SOURCE_PR" --body "$COMMENT_BODY" \
            || echo "::warning::Also could not post the fallback comment on PR #$SOURCE_PR."
        fi
        exit 0
